# /etc/systemd/system/<unit>.service.d/10-rfxn-defense.conf
# Owned by rfxn-defense-systemd; do not hand-edit.
#
# Always-on tenant-unit hardening. The conditional address-family and
# userns cuts live in 12-rfxn-defense-rxrpc-af.conf and
# 15-rfxn-defense-userns.conf respectively (managed by detect.sh).
#
# AF_KEY (PF_KEYv2): legacy IPsec SA-configuration socket. Closes the
# easier of the two SA-config paths used by the Dirty Frag / Fragnesia
# chain (the other is XFRM netlink, which still requires CAP_NET_ADMIN).
# Modern userland uses XFRM netlink; AF_KEY is legacy with negligible
# compatibility risk on the five tenant units.
#
# AF_RDS (PinTheft entry point): Reliable Datagram Sockets, the
# attack surface for the RDS zerocopy double-free chained to io_uring
# fixed buffers. No tenant unit (user@, sshd, cron, crond, atd) opens
# AF_RDS sockets in any supported workload; restricting it on EL10 and
# Ubuntu 24.04+ kernels (where io_uring is present) closes PinTheft's
# socket-domain prerequisite at unit-start time.
#
# Override per-host: drop a 20-override.conf with empty values
# to neutralize a directive, or 25-additions.conf to add new ones.
# See README "Manual override (finer than detection)".
[Service]
RestrictAddressFamilies=~AF_ALG ~AF_KEY ~AF_RDS
SystemCallArchitectures=native
SystemCallFilter=~@swap
