# /usr/share/rfxn-defense/conditional/systemd/13-rfxn-defense-rds.conf
# Owned by rfxn-defense-systemd; CONDITIONAL TEMPLATE.
#
# Not auto-staged by %posttrans. Operator copies into a unit's
# .service.d/ to apply the AF_RDS restriction to container-runtime
# daemons (containerd, podman) that legitimately need network sockets
# but should not need AF_RDS.
#
# The always-on 10-* drop-in already restricts AF_RDS for the 5 tenant
# units (user@, sshd, cron, crond, atd). This 13-* template exists for
# operator extension to non-tenant daemons; defense-in-depth.
#
# systemd merges RestrictAddressFamilies across drop-ins; pairing this
# with the 10-* file's body produces the union of restrictions at
# unit start time.
[Service]
RestrictAddressFamilies=~AF_RDS
