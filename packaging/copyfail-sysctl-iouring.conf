# /etc/sysctl.d/99-copyfail-defense-iouring.conf
# Owned by copyfail-defense-sysctl; managed by %posttrans detection.
# Hand-edits ARE preserved (cmp-and-skip per SPEC §12.10.2a / D-57):
# %posttrans detects divergence, logs WARN, and does not overwrite.
# /var/lib/copyfail-defense/auto-detect.json captures the decision
# state separately from this file's on-disk content.
#
# PinTheft (CVE pending) secondary mitigation, io_uring disable.
# Available on Linux 6.6+ only (EL10+, Ubuntu 24.04+). Disabling
# io_uring breaks containerd/podman runtimes and many liburing-
# based consumers (postgres>=16, scylla, dockerd, redis, nginx,
# envoy). Auto-detect suppresses this drop-in when any signal
# indicates a consumer is present; see detect.sh
# detect_io_uring_workload() and the auto-detect.json reason field.
#
# Suppressed (file removed) when:
#   - rootless containers present
#   - userns consumers present (Flatpak, firejail, browser)
#   - io_uring workload signal (liburing.so in /proc/maps, known
#     consumer binary, io_uring-named systemd unit)
#   - kernel < 6.6 (key non-existent)
#   - CFD_SUPPRESS_IOURING_DISABLE=1 env at detect.sh invocation
#
# Force-on with CFD_FORCE_IOURING_DISABLE=1 or
# /etc/copyfail/force-full sentinel.
#
# Key prefixed with '-' so sysctl --system silently skips on kernels
# without io_uring_disabled (sysctl.d(5)).
#
#   0 = enabled (default)
#   1 = disabled for new processes
#   2 = disabled with hard-disable for existing tasks (DEFAULT for us)

-kernel.io_uring_disabled            = 2
