# /etc/sysctl.d/99-rfxn-defense-ptrace.conf
# Owned by rfxn-defense-sysctl; managed by %posttrans detection.
# Hand-edits ARE preserved (cmp-and-skip per SPEC §12.10.2a / D-57).
#
# ssh-keysign-pwn (CVE-2026-46333) primary mitigation. Independent
# of the userns drop-in (split out in v3.0.1 fixup so that
# suppressing userns / iouring for rootless or Flatpak workloads
# does NOT also drop ptrace_scope - keysign-pwn coverage is not
# tied to either of those workloads).
#
# __ptrace_may_access() race exposes root-readable file descriptors
# (SSH host keys, /etc/shadow) to unprivileged callers via
# pidfd_getfd on exiting SUID binaries. Yama LSM gates the same
# permission check, short-circuiting the bug regardless of the
# mm-NULL fall-through.
#
#   0 = unrestricted (RHEL family default - WORST)
#   1 = parent-child only (Ubuntu/Debian default - PoC bypasses this)
#   2 = CAP_SYS_PTRACE required (closes the bug; gdb -p as root still works)
#   3 = ptrace fully off including root (one-way trip until reboot)
#
# Default 2: closes pidfd_getfd path without breaking root debugging.
# Override per-host by dropping a 50-*.conf with a different value
# (sysctl.d merges in lexicographic order).
#
# Key prefixed with '-' so sysctl --system silently skips on
# kernels that don't expose Yama (extremely uncommon; mostly
# embedded / hardened-configs without LSM=yama).
-kernel.yama.ptrace_scope = 2
